# ==============================================================================
# Hyprlock Configuration for Xiaomi Pad 5 (nabu)
# ==============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/nabu_alarm.png
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">Enter Password...</span>
    hide_input = false
    check_color = rgb(203, 166, 247)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(250, 179, 135)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(242, 243, 244, 0.95)
    font_size = 96
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrains Mono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "󰁹 $(cat /sys/class/power_supply/qcom-battery/capacity 2>/dev/null || echo 100)%"
    color = rgba(242, 243, 244, 0.8)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, -160
    halign = center
    valign = center
}
