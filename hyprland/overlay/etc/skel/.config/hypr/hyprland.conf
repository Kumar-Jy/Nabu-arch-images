# Hyprland config for Xiaomi Pad 5 (nabu)
# Panel: DSI-1, native 1600x2560@120, scale 2, rotated to landscape (transform 1).

monitor=DSI-1,1600x2560@120,0x0,2,transform,1

$mainMod = SUPER

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    cursor_inactive_timeout = 20
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.9
}

animations {
    enabled = yes
    bezier = myBezier,0.05,0.9,0.1,1.05
    animation = windows,1,5,myBezier
    animation = windowsOut,1,5,default,popin 80%
    animation = border,1,8,default
    animation = workspaces,1,6,default,slide
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    touchdevice {
        transform = 1
    }
}

bind = $mainMod, RETURN, exec, foot
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, K, exec, gdbus call --session --dest sm.puri.OSK0 --object-path /sm/puri/OSK0 --method sm.puri.OSK0.SetVisible true
bind = $mainMod SHIFT, K, exec, gdbus call --session --dest sm.puri.OSK0 --object-path /sm/puri/OSK0 --method sm.puri.OSK0.SetVisible false
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = squeekboard

misc {
    disable_hyprland_logo = true
}
