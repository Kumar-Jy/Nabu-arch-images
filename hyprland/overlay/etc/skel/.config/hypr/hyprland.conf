# ==============================================================================
# Hyprland Touch Edition for Xiaomi Pad 5 (nabu)
# Powered by ML4W Theme & hyprgrass 1:1 Touchscreen Gestures
# ==============================================================================

# --- Display Configuration ---
# Native NT36523 panel is portrait (1600x2560).
# transform = 1 rotates 90° clockwise to Landscape (2560x1600 @ 120Hz).
# scale = 1.6 gives a comfortable ~1600x1000 effective UI space.
monitor = DSI-1, 1600x2560@120, 0x0, 1.6, transform, 1

# --- Autostart Daemons & Shell ---
exec-once = waybar &
exec-once = swaync &
exec-once = hypridle &
exec-once = hyprpaper &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = /usr/bin/nabu-hypr-rotate &

# --- Environment Variables ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = LIBVA_DRIVER_NAME,iris

# --- Input Configuration ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchdevice {
        transform = 1
        output = DSI-1
    }
}

device {
    name = nvtcapacitivepen
    output = DSI-1
}

# --- General Appearance & Layout ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 0.98
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Window Rules for OSK & Overlays ---
windowrulev2 = nofocus, class:^(oskb|Oskb)$
windowrulev2 = float, class:^(oskb|Oskb)$
windowrulev2 = pin, class:^(oskb|Oskb)$
windowrulev2 = noborder, class:^(oskb|Oskb)$
windowrulev2 = nodim, class:^(oskb|Oskb)$

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}

# ==============================================================================
# HYPRGRASS TOUCHSCREEN GESTURES PLUGIN
# ==============================================================================
plugin = /usr/lib/hyprland/libhyprgrass.so

plugin:touch_gestures {
    sensitivity = 4.0
    long_press_delay = 400
    edge_margin = 15
    resize_on_border_long_press = true
    hold_touches = true
    hold_touches_delay = 40
}

# Gestures:
bind = , swipe:4:l, workspace, +1
bind = , swipe:4:r, workspace, -1
bind = , swipe:3:u, exec, pkill rofi || rofi -show drun -theme ~/.config/rofi/config.rasi
bind = , swipe:3:d, killactive
bind = , pinch:3:in, fullscreen, 1
bind = , edge:d:u, exec, /usr/bin/nabu-osk-toggle
bind = , edge:r:l, exec, swaync-client -t -sw
bind = , edge:u:d, exec, rofi -show window

# ==============================================================================
# KEY BINDINGS & HARDWARE SHORTCUTS
# ==============================================================================
$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, dolphin || nautilus
bind = $mainMod, V, togglefloating
bind = $mainMod, SPACE, exec, pkill rofi || rofi -show drun -theme ~/.config/rofi/config.rasi
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, K, exec, /usr/bin/nabu-osk-toggle
bind = $mainMod, ESCAPE, exec, wlogout

# Hardware Volume & Brightness Keys
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1-6)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Mouse drag/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
