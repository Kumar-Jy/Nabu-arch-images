name: Create Installer Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID (empty = auto-detect latest)"
        type: string
        required: false
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  upload-non-atomic:
    runs-on: ubuntu-24.04-arm
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      plasma_url: ${{ steps.upload.outputs.plasma_url }}
      gnome_url: ${{ steps.upload.outputs.gnome_url }}
      hyprland_url: ${{ steps.upload.outputs.hyprland_url }}
      base_url: ${{ steps.upload.outputs.base_url }}
    steps:
      - name: Resolve run ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "Auto-detecting latest successful build run..."
            RUN_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-installers.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // ""')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No run ID provided or auto-detected." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Using run ID: $RUN_ID"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Upload to Pixeldrain
        id: upload
        run: |
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          REPO="${{ github.repository }}"

          echo "Uploading Plasma artifact..."
          curl -sLO "https://nightly.link/$REPO/actions/runs/$RUN_ID/arch-nabu-installer-plasma.zip"
          PLASMA_RES=$(curl -s -T arch-nabu-installer-plasma.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
          PLASMA_ID=$(echo "$PLASMA_RES" | jq -r '.id')
          echo "plasma_url=https://pixeldrain.com/u/$PLASMA_ID" >> $GITHUB_OUTPUT
          rm -f arch-nabu-installer-plasma.zip

          echo "Uploading GNOME artifact..."
          curl -sLO "https://nightly.link/$REPO/actions/runs/$RUN_ID/arch-nabu-installer-gnome.zip"
          GNOME_RES=$(curl -s -T arch-nabu-installer-gnome.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
          GNOME_ID=$(echo "$GNOME_RES" | jq -r '.id')
          echo "gnome_url=https://pixeldrain.com/u/$GNOME_ID" >> $GITHUB_OUTPUT
          rm -f arch-nabu-installer-gnome.zip

          echo "Uploading Hyprland artifact..."
          curl -sLO "https://nightly.link/$REPO/actions/runs/$RUN_ID/arch-nabu-installer-hyprland.zip" || true
          if [ -f arch-nabu-installer-hyprland.zip ]; then
            HYPR_RES=$(curl -s -T arch-nabu-installer-hyprland.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
            HYPR_ID=$(echo "$HYPR_RES" | jq -r '.id')
            echo "hyprland_url=https://pixeldrain.com/u/$HYPR_ID" >> $GITHUB_OUTPUT
            rm -f arch-nabu-installer-hyprland.zip
          fi

          echo "Uploading Base image artifact..."
          curl -sLO "https://nightly.link/$REPO/actions/runs/$RUN_ID/arch-nabu-rootfs-base.zip" || true
          if [ -f arch-nabu-rootfs-base.zip ]; then
            BASE_RES=$(curl -s -T arch-nabu-rootfs-base.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
            BASE_ID=$(echo "$BASE_RES" | jq -r '.id')
            echo "base_url=https://pixeldrain.com/u/$BASE_ID" >> $GITHUB_OUTPUT
            rm -f arch-nabu-rootfs-base.zip
          fi

  upload-atomic:
    runs-on: ubuntu-24.04-arm
    outputs:
      gnome_run_id: ${{ steps.resolve.outputs.gnome_run_id }}
      plasma_run_id: ${{ steps.resolve.outputs.plasma_run_id }}
      plasma_url: ${{ steps.upload.outputs.plasma_url }}
      gnome_url: ${{ steps.upload.outputs.gnome_url }}
    steps:
      - name: Resolve atomic branch run IDs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GH_API="https://api.github.com/repos/${{ github.repository }}"

          GNOME_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$GH_API/actions/workflows/build-gnome.yml/runs?branch=atomic&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // ""')
          PLASMA_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$GH_API/actions/workflows/build-plasma.yml/runs?branch=atomic&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // ""')

          echo "gnome_run_id=$GNOME_ID" >> $GITHUB_OUTPUT
          echo "plasma_run_id=$PLASMA_ID" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Upload atomic artifacts to Pixeldrain
        id: upload
        run: |
          if [ -n "${{ steps.resolve.outputs.plasma_run_id }}" ]; then
            echo "Uploading atomic Plasma artifact..."
            curl -sLO "https://nightly.link/${{ github.repository }}/actions/runs/${{ steps.resolve.outputs.plasma_run_id }}/Nabu-alarm-atomic-plasma-installer.zip"
            RES=$(curl -s -T Nabu-alarm-atomic-plasma-installer.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
            ID=$(echo "$RES" | jq -r '.id')
            echo "plasma_url=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT
            rm -f Nabu-alarm-atomic-plasma-installer.zip
          fi
          if [ -n "${{ steps.resolve.outputs.gnome_run_id }}" ]; then
            echo "Uploading atomic GNOME artifact..."
            curl -sLO "https://nightly.link/${{ github.repository }}/actions/runs/${{ steps.resolve.outputs.gnome_run_id }}/Nabu-alarm-atomic-gnome-installer.zip"
            RES=$(curl -s -T Nabu-alarm-atomic-gnome-installer.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
            ID=$(echo "$RES" | jq -r '.id')
            echo "gnome_url=https://pixeldrain.com/u/$ID" >> $GITHUB_OUTPUT
            rm -f Nabu-alarm-atomic-gnome-installer.zip
          fi

  create-release:
    needs: [upload-non-atomic, upload-atomic]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CREATED=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ needs.upload-non-atomic.outputs.run_id }}" \
            | jq -r '.created_at // ""')
          BUILD_DATE=$(date -d "$CREATED" +%d.%m.%Y 2>/dev/null || echo "latest")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          RUN_ID="${{ needs.upload-non-atomic.outputs.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          [ -z "$BRANCH" ] && BRANCH="non-atomic-7.3.y"
          NL_BASE="https://nightly.link/$REPO/actions/runs/$RUN_ID"

          PLASMA_PD_URL="${{ needs.upload-non-atomic.outputs.plasma_url }}"
          GNOME_PD_URL="${{ needs.upload-non-atomic.outputs.gnome_url }}"
          HYPRLAND_PD_URL="${{ needs.upload-non-atomic.outputs.hyprland_url }}"
          BASE_PD_URL="${{ needs.upload-non-atomic.outputs.base_url }}"

          ATOMIC_GNOME_RUN="${{ needs.upload-atomic.outputs.gnome_run_id }}"
          ATOMIC_PLASMA_RUN="${{ needs.upload-atomic.outputs.plasma_run_id }}"
          NL_BASE_GNOME="https://nightly.link/$REPO/actions/runs/$ATOMIC_GNOME_RUN/Nabu-alarm-atomic-gnome-installer.zip"
          NL_BASE_PLASMA="https://nightly.link/$REPO/actions/runs/$ATOMIC_PLASMA_RUN/Nabu-alarm-atomic-plasma-installer.zip"
          ATOMIC_PLASMA_PD_URL="${{ needs.upload-atomic.outputs.plasma_url }}"
          ATOMIC_GNOME_PD_URL="${{ needs.upload-atomic.outputs.gnome_url }}"

          cat > release-notes.md << BODY
          # 🚀 Arch Linux ARM for Xiaomi Pad 5 (nabu)

          > **Build Date:** $BUILD_DATE &nbsp;|&nbsp; **Target Device:** Xiaomi Pad 5 (\`nabu\`)

          🔗 **Documentation & Project Links:**
          - 📜 **[CHANGELOG.md](https://github.com/$REPO/blob/$BRANCH/CHANGELOG.md)** — Full changelog & release history
          - 📊 **[Hardware Support Matrix](https://github.com/$REPO#hardware-support-status)** — Complete hardware feature status
          - 📖 **[Troubleshooting Guide](https://github.com/$REPO/blob/$BRANCH/TROUBLESHOOTING.md)** — Offline recovery & repair guide
          - 📦 **[Kernel Packages](https://github.com/Kumar-Jy/nabu-pkgs/releases/tag/repo)** — Standalone kernel & headers repository

          ---

          ## 📥 Installer Downloads

          ### 🔹 Standard Builds (Non-Atomic)

          | Desktop Edition | Direct Download (nightly.link) | Mirror (Pixeldrain) |
          | :--- | :--- | :--- |
          | **KDE Plasma** | [📥 Download Plasma ZIP](${NL_BASE}/arch-nabu-installer-plasma.zip) | $([ -n "$PLASMA_PD_URL" ] && echo "[🌐 Pixeldrain Mirror]($PLASMA_PD_URL)" || echo "Pending") |
          | **GNOME** | [📥 Download GNOME ZIP](${NL_BASE}/arch-nabu-installer-gnome.zip) | $([ -n "$GNOME_PD_URL" ] && echo "[🌐 Pixeldrain Mirror]($GNOME_PD_URL)" || echo "Pending") |
          | **Hyprland (Touch)** | [📥 Download Hyprland ZIP](${NL_BASE}/arch-nabu-installer-hyprland.zip)<br>*(Also in Release Assets)* | $([ -n "$HYPRLAND_PD_URL" ] && echo "[🌐 Pixeldrain Mirror]($HYPRLAND_PD_URL)" || echo "Pending") |
          | **Base Rootfs** | [📥 Download Base ZIP](${NL_BASE}/arch-nabu-rootfs-base.zip)<br>*(Also in Release Assets)* | $([ -n "$BASE_PD_URL" ] && echo "[🌐 Pixeldrain Mirror]($BASE_PD_URL)" || echo "Pending") |

          > **Attached Release Assets:**
          > - \`arch-nabu-installer-hyprland.zip\` — Direct TWRP-flashable installer zip for Hyprland Touch Edition
          > - \`arch-nabu-rootfs-base.img.gz\` — Base Arch Linux ARM rootfs image (compressed ext4)
          > - \`nabu-arch-rEFInd.zip\` — Multi-boot UEFI bootloader
          > - \`alohauefi.img\` — Aloha UEFI boot image for single-boot / fastboot flashing
          > - \`get-plasma.sh\` / \`get-gnome.sh\` / \`get-hyprland.sh\` / \`get-base.sh\` — Direct CLI download scripts

          BODY

          if [ -n "$ATOMIC_GNOME_RUN" ] || [ -n "$ATOMIC_PLASMA_RUN" ]; then
            cat >> release-notes.md << ATOMIC_BODY

          ### ⚛️ Atomic Builds (bootc)

          | Desktop Edition | Direct Download (nightly.link) | Mirror (Pixeldrain) |
          | :--- | :--- | :--- |
          $([ -n "$ATOMIC_PLASMA_RUN" ] && echo "| **KDE Plasma (Atomic)** | [📥 Download Plasma Atomic](${NL_BASE_PLASMA}) | $([ -n "$ATOMIC_PLASMA_PD_URL" ] && echo "[🌐 Pixeldrain Mirror]($ATOMIC_PLASMA_PD_URL)" || echo "Pending") |")
          $([ -n "$ATOMIC_GNOME_RUN" ] && echo "| **GNOME (Atomic)** | [📥 Download GNOME Atomic](${NL_BASE_GNOME}) | $([ -n "$ATOMIC_GNOME_PD_URL" ] && echo "[🌐 Pixeldrain Mirror]($ATOMIC_GNOME_PD_URL)" || echo "Pending") |")

          ATOMIC_BODY
          fi

          cat >> release-notes.md << 'FOOTER_BODY'
          ---

          ## 🔑 Login Credentials

          | Account | Username | Password |
          | :--- | :--- | :--- |
          | **Default User** | `user` | `123456` |
          | **Root (sudo)** | `user` | `123456` |

          - **Auto-login:** The system automatically boots and logs into the desktop environment.
          - **Root access:** Use password `123456` for `sudo` operations and terminal root access.

          ---

          ## 🛠️ Quick Installation Guide

          > [!NOTE]
          > For a triple-boot setup (Windows + Android + Linux), Windows must be installed before Arch Linux.
          > Follow this [guide](https://github.com/Kumar-Jy/Windows-in-NABU-Without-PC/blob/main/guide/Installation.md) 

          1. **Boot into [Hybrid-twrp](https://github.com/Kumar-Jy/twrp_device_xiaomi_nabu/releases/tag/mod-hybrid):**
             ```bash
             fastboot boot hybrid-twrp.img
             ```
          2. **Partitioning (if not already done and must skip it if windows already installed):**
             - In TWRP, go to **Advanced > Terminal** and run `partition`.
             - Follow prompts to create `linux` and `esp` partitions, then **Reboot > Recovery**.
          3. **Flash Installer:**
             - Download `arch-nabu-installer-*.zip`.
             - In TWRP, tap **Install**, select the zip, and swipe to flash.
          4. **Reboot:**
             - Tap **Reboot > System** (rEFInd multi-boot menu will handle OS boot).
          FOOTER_BODY

      - name: Generate download scripts
        run: |
          mkdir -p scripts-tmp
          RUN_ID="${{ needs.upload-non-atomic.outputs.run_id }}"
          REPO="${{ github.repository }}"

          echo '#!/usr/bin/env bash' > scripts-tmp/get-gnome.sh
          echo 'set -euo pipefail' >> scripts-tmp/get-gnome.sh
          echo "REPO=\"$REPO\"" >> scripts-tmp/get-gnome.sh
          echo "RUN_ID=\"$RUN_ID\"" >> scripts-tmp/get-gnome.sh
          echo 'ARTIFACT="arch-nabu-installer-gnome"' >> scripts-tmp/get-gnome.sh
          echo 'URL="https://nightly.link/${REPO}/actions/runs/${RUN_ID}/${ARTIFACT}.zip"' >> scripts-tmp/get-gnome.sh
          echo 'echo "Downloading GNOME installer from:"' >> scripts-tmp/get-gnome.sh
          echo 'echo "  $URL"' >> scripts-tmp/get-gnome.sh
          echo 'curl -fL "$URL" -o nabu-gnome-installer.zip' >> scripts-tmp/get-gnome.sh
          echo 'echo "Saved: nabu-gnome-installer.zip"' >> scripts-tmp/get-gnome.sh
          chmod +x scripts-tmp/get-gnome.sh

          echo '#!/usr/bin/env bash' > scripts-tmp/get-plasma.sh
          echo 'set -euo pipefail' >> scripts-tmp/get-plasma.sh
          echo "REPO=\"$REPO\"" >> scripts-tmp/get-plasma.sh
          echo "RUN_ID=\"$RUN_ID\"" >> scripts-tmp/get-plasma.sh
          echo 'ARTIFACT="arch-nabu-installer-plasma"' >> scripts-tmp/get-plasma.sh
          echo 'URL="https://nightly.link/${REPO}/actions/runs/${RUN_ID}/${ARTIFACT}.zip"' >> scripts-tmp/get-plasma.sh
          echo 'echo "Downloading Plasma installer from:"' >> scripts-tmp/get-plasma.sh
          echo 'echo "  $URL"' >> scripts-tmp/get-plasma.sh
          echo 'curl -fL "$URL" -o nabu-plasma-installer.zip' >> scripts-tmp/get-plasma.sh
          echo 'echo "Saved: nabu-plasma-installer.zip"' >> scripts-tmp/get-plasma.sh
          chmod +x scripts-tmp/get-plasma.sh

          echo '#!/usr/bin/env bash' > scripts-tmp/get-hyprland.sh
          echo 'set -euo pipefail' >> scripts-tmp/get-hyprland.sh
          echo "REPO=\"$REPO\"" >> scripts-tmp/get-hyprland.sh
          echo "RUN_ID=\"$RUN_ID\"" >> scripts-tmp/get-hyprland.sh
          echo 'ARTIFACT="arch-nabu-installer-hyprland"' >> scripts-tmp/get-hyprland.sh
          echo 'URL="https://nightly.link/${REPO}/actions/runs/${RUN_ID}/${ARTIFACT}.zip"' >> scripts-tmp/get-hyprland.sh
          echo 'echo "Downloading Hyprland installer from:"' >> scripts-tmp/get-hyprland.sh
          echo 'echo "  $URL"' >> scripts-tmp/get-hyprland.sh
          echo 'curl -fL "$URL" -o nabu-hyprland-installer.zip' >> scripts-tmp/get-hyprland.sh
          echo 'echo "Saved: nabu-hyprland-installer.zip"' >> scripts-tmp/get-hyprland.sh
          chmod +x scripts-tmp/get-hyprland.sh

          echo '#!/usr/bin/env bash' > scripts-tmp/get-base.sh
          echo 'set -euo pipefail' >> scripts-tmp/get-base.sh
          echo "REPO=\"$REPO\"" >> scripts-tmp/get-base.sh
          echo "RUN_ID=\"$RUN_ID\"" >> scripts-tmp/get-base.sh
          echo 'ARTIFACT="arch-nabu-rootfs-base"' >> scripts-tmp/get-base.sh
          echo 'URL="https://nightly.link/${REPO}/actions/runs/${RUN_ID}/${ARTIFACT}.zip"' >> scripts-tmp/get-base.sh
          echo 'echo "Downloading Base rootfs image from:"' >> scripts-tmp/get-base.sh
          echo 'echo "  $URL"' >> scripts-tmp/get-base.sh
          echo 'curl -fL "$URL" -o nabu-base-rootfs.zip' >> scripts-tmp/get-base.sh
          echo 'echo "Saved: nabu-base-rootfs.zip"' >> scripts-tmp/get-base.sh
          chmod +x scripts-tmp/get-base.sh

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip pigz jq curl

      - name: Prepare standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ needs.upload-non-atomic.outputs.run_id }}"
          REPO="${{ github.repository }}"
          mkdir -p release-assets

          echo "Fetching rEFInd bootloader..."
          curl -fL --retry 3 "https://nightly.link/$REPO/actions/runs/$RUN_ID/nabu-arch-rEFInd.zip" -o release-assets/nabu-arch-rEFInd.zip || true

          if [ -f base/overlay/opt/nabu/alohauefi.img ]; then
            cp base/overlay/opt/nabu/alohauefi.img release-assets/alohauefi.img
          else
            curl -fL --retry 3 "https://nightly.link/$REPO/actions/runs/$RUN_ID/alohauefi.img" -o release-assets/alohauefi.img || true
          fi

          echo "Fetching Hyprland installer zip..."
          if ! curl -fL --retry 3 "https://nightly.link/$REPO/actions/runs/$RUN_ID/arch-nabu-installer-hyprland.zip" -o release-assets/arch-nabu-installer-hyprland.zip || [ ! -s release-assets/arch-nabu-installer-hyprland.zip ]; then
            echo "Falling back to gh run download for Hyprland installer..."
            mkdir -p hyprland-tmp
            if gh run download "$RUN_ID" -n arch-nabu-installer-hyprland -D hyprland-tmp; then
              (cd hyprland-tmp && zip -r -9 ../release-assets/arch-nabu-installer-hyprland.zip .)
              rm -rf hyprland-tmp
            fi
          fi

          echo "Fetching Base rootfs image..."
          mkdir -p base-tmp
          if gh run download "$RUN_ID" -n arch-nabu-rootfs-base -D base-tmp; then
            if [ -f base-tmp/rootfs.img.gz ]; then
              cp base-tmp/rootfs.img.gz release-assets/arch-nabu-rootfs-base.img.gz
            fi
            rm -rf base-tmp
          fi
          if [ ! -f release-assets/arch-nabu-rootfs-base.img.gz ]; then
            echo "Falling back to nightly.link for base rootfs image..."
            curl -fL --retry 3 "https://nightly.link/$REPO/actions/runs/$RUN_ID/arch-nabu-rootfs-base.zip" -o base-tmp.zip || true
            if [ -s base-tmp.zip ]; then
              unzip -q -o base-tmp.zip -d base-tmp
              [ -f base-tmp/rootfs.img.gz ] && cp base-tmp/rootfs.img.gz release-assets/arch-nabu-rootfs-base.img.gz
              rm -rf base-tmp base-tmp.zip
            fi
          fi

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arch-nabu --yes 2>/dev/null || true
          sleep 2

          files=""
          for f in scripts-tmp/get-*.sh release-assets/*; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
              if [ "$size" -ge 2147483648 ]; then
                echo "Warning: $f is >= 2GB ($size bytes), skipping release asset upload."
              else
                files="$files $f"
              fi
            fi
          done

          TITLE="Arch Linux ARM for Xiaomi Pad 5 ($BUILD_DATE)"
          [ -z "$BUILD_DATE" ] && TITLE="arch-nabu"

          gh release create arch-nabu \
            --title "$TITLE" \
            --notes-file release-notes.md \
            $files
