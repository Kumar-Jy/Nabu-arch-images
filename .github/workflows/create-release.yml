name: Create Installer Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID (empty = auto-detect latest)"
        type: string
        required: false
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true

jobs:
  create-release:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve run ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "Auto-detecting latest successful build run..."
            RUN_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-installers.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // ""')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No run ID provided or auto-detected." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Using run ID: $RUN_ID"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip jq

      - name: Download GNOME artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --repo ${{ github.repository }} \
            --name arch-nabu-installer-gnome \
            --dir gnome

      - name: Download Plasma artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --repo ${{ github.repository }} \
            --name arch-nabu-installer-plasma \
            --dir plasma

      - name: Zip artifacts
        run: |
          cd gnome && zip -r ../arch-nabu-installer-gnome.zip . && cd ..
          cd plasma && zip -r ../arch-nabu-installer-plasma.zip . && cd ..

      - name: Upload to Pixeldrain
        id: upload
        run: |
          echo "Uploading Plasma artifact..."
          PLASMA_RES=$(curl -s -T arch-nabu-installer-plasma.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
          PLASMA_ID=$(echo "$PLASMA_RES" | jq -r '.id')
          echo "plasma_url=https://pixeldrain.com/u/$PLASMA_ID" >> $GITHUB_OUTPUT

          echo "Uploading GNOME artifact..."
          GNOME_RES=$(curl -s -T arch-nabu-installer-gnome.zip -u ":${{ secrets.PIXELDRAIN_API_KEY }}" https://pixeldrain.com/api/file/)
          GNOME_ID=$(echo "$GNOME_RES" | jq -r '.id')
          echo "gnome_url=https://pixeldrain.com/u/$GNOME_ID" >> $GITHUB_OUTPUT

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CREATED=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.resolve.outputs.run_id }}" \
            | jq -r '.created_at // ""')
          BUILD_DATE=$(date -d "$CREATED" +%d.%m.%Y 2>/dev/null || echo "latest")

          cat > release-notes.md << BODY
          Built images
          - Base
          - KDE Plasma
          - GNOME

          Build date: $BUILD_DATE

          **Login Credentials:**
          - Username: \`user\`
          - Password: \`123456\`

          **First Boot:**
          1. The system will auto-login to the desktop
          2. Use password \`123456\` for sudo operations
          3. Connect to Wi-Fi using NetworkManager (click network icon in system tray)

          ## Downloads

          - [Plasma Installer (Pixeldrain)](${{ steps.upload.outputs.plasma_url }})
          - [GNOME Installer (Pixeldrain)](${{ steps.upload.outputs.gnome_url }})

          Rootfs images are also available from the artifacts section of the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ steps.resolve.outputs.run_id }}).
          BODY

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arch-nabu --yes 2>/dev/null || true
          sleep 2
          gh release create arch-nabu \
            --title "arch-nabu" \
            --notes-file release-notes.md \
            arch-nabu-installer-gnome.zip \
            arch-nabu-installer-plasma.zip
