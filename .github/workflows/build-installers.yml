name: Build installers

on:
  workflow_dispatch:
    inputs:
      trigger_release:
        description: "Also create a GitHub release after build"
        type: boolean
        default: false
      kernel_version:
        description: "Kernel version to install (e.g. 6.14.11-8); empty = latest in [nabu] repo"
        type: string
        default: "6.14.11-8"
        required: false
      nightly_kernel_url:
        description: "URL to a ZIP containing kernel/headers (nightly.link); empty = use repo/version"
        type: string
        default: ""
        required: false

jobs:
  # ============================================================
  # Build base container image (kernel pin / nightly zip applied here)
  # ============================================================
  build-base-image:
    name: Build base image
    uses: ./.github/workflows/build-base.yml
    with:
      kernel_version: ${{ inputs.kernel_version }}
      nightly_kernel_url: ${{ inputs.nightly_kernel_url }}
    permissions:
      contents: read
      packages: write
      actions: write

  # ============================================================
  # Build GNOME container + installer (uses the base just pushed)
  # ============================================================
  build-gnome-image:
    name: Build GNOME image
    needs: build-base-image
    if: ${{ !cancelled() && needs.build-base-image.result == 'success' }}
    uses: ./.github/workflows/build-gnome.yml
    with:
      kernel_version: ${{ inputs.kernel_version }}
      nightly_kernel_url: ${{ inputs.nightly_kernel_url }}
      rebuild_base: false
    permissions:
      contents: read
      packages: write
      actions: write

  # ============================================================
  # Build Plasma container + installer (uses the base just pushed)
  # ============================================================
  build-plasma-image:
    name: Build Plasma image
    needs: build-base-image
    if: ${{ !cancelled() && needs.build-base-image.result == 'success' }}
    uses: ./.github/workflows/build-plasma.yml
    with:
      kernel_version: ${{ inputs.kernel_version }}
      nightly_kernel_url: ${{ inputs.nightly_kernel_url }}
      rebuild_base: false
    permissions:
      contents: read
      packages: write
      actions: write

  # ============================================================
  # Optional: create a GitHub release with download scripts
  # ============================================================
  trigger-release:
    if: ${{ inputs.trigger_release == true }}
    needs:
      - build-gnome-image
      - build-plasma-image
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger create-release workflow
        run: |
          gh workflow run "Create Installer Release" \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f gnome_run_id=${{ github.run_id }} \
            -f plasma_run_id=${{ github.run_id }}