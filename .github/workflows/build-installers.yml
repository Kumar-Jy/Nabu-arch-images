name: Build installers

on:
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "Build base image first"
        type: boolean
        default: true
      build_gnome:
        description: "Build GNOME installer"
        type: boolean
        default: true
      build_plasma:
        description: "Build Plasma installer"
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release after the builds"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-base:
    if: ${{ inputs.rebuild_base }}
    uses: ./.github/workflows/build-base.yml
    permissions:
      contents: read
      packages: write
      actions: write

  build-gnome:
    needs: [build-base]
    if: ${{ !cancelled() && needs.build-base.result != 'failure' && inputs.build_gnome }}
    uses: ./.github/workflows/build-gnome.yml
    with:
      rebuild_base: false
      trigger_release: false
    permissions:
      contents: read
      packages: write
      actions: write

  build-plasma:
    needs: [build-base]
    if: ${{ !cancelled() && needs.build-base.result != 'failure' && inputs.build_plasma }}
    uses: ./.github/workflows/build-plasma.yml
    with:
      rebuild_base: false
      trigger_release: false
    permissions:
      contents: read
      packages: write
      actions: write

  create-release:
    needs: [build-gnome, build-plasma]
    if: ${{ !cancelled() && inputs.create_release && (needs.build-gnome.result == 'success' || needs.build-plasma.result == 'success') }}
    uses: ./.github/workflows/create-release.yml
    with:
      gnome_run_id: ${{ needs.build-gnome.result == 'success' && github.run_id || '' }}
      plasma_run_id: ${{ needs.build-plasma.result == 'success' && github.run_id || '' }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
