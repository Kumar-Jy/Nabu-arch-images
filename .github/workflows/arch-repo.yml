name: Arch repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build-repo:
    name: Build pacman repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman gnupg
          (type -p wget >/dev/null || sudo apt-get install wget -y) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-keys

      - name: Setup repo structure
        run: |
          mkdir -p repo/aarch64
          cp repo/nabu-repo.asc repo/aarch64/ 2>/dev/null || true

      - name: Fetch packages from rodriguezst
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo/aarch64
          echo "Fetching packages from rodriguezst/arch-repo..."
          gh release list -R rodriguezst/arch-repo --json tagName -q '.[].tagName' 2>/dev/null | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "  Release: $tag"
            gh release download "$tag" -R rodriguezst/arch-repo \
              --pattern "*.pkg.tar.zst" \
              --pattern "*.pkg.tar.xz" \
              --pattern "*.sig" \
              --dir . 2>/dev/null || true
          done
          rm -f visual-studio-code-bin*.pkg.tar.* visual-studio-code-bin*.sig 2>/dev/null || true
          rm -f python2*.pkg.tar.* python2*.sig 2>/dev/null || true
          rm -f widevine*.pkg.tar.* widevine*.sig 2>/dev/null || true
          rm -f reboot2android*.pkg.tar.* reboot2android*.sig 2>/dev/null || true
          rm -f refind-nabu*.pkg.tar.* refind-nabu*.sig 2>/dev/null || true
          ls -la *.pkg.tar.* 2>/dev/null || echo "  No packages found"

      - name: Build local packages (upower-nncc, bootc, code, python2, widevine)
        run: |
          for pkgdir in upower-nncc bootc code python2 widevine; do
            echo "::group::Building $pkgdir..."
            podman run --rm \
              -v "$(pwd)/packages/$pkgdir:/work" \
              -v "$(pwd)/repo/aarch64:/output" \
              -w /work \
              menci/archlinuxarm:base \
              sh -c "
                sed -i '/^#DisableSandbox/s/^#//' /etc/pacman.conf
                echo 'DisableSandbox' >> /etc/pacman.conf
                pacman-key --init
                pacman-key --populate archlinuxarm
                pacman -Syu --noconfirm
                pacman -S --noconfirm base-devel
                useradd -m builder
                echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
                chown -R builder:builder /work
                su builder -c 'cd /work && makepkg -s --noconfirm --skipchecksums'
                cp /work/*.pkg.tar.* /output/ 2>/dev/null || true
              "
            echo "::endgroup::"
          done

      - name: Fix permissions
        run: sudo chown -R "$USER:$USER" repo/aarch64/

      - name: Re-sign packages
        run: |
          cd repo/aarch64
          GPG_KEY_ID="${{ secrets.REPO_GPG_KEY_ID }}"
          shopt -s nullglob
          for pkg in *.pkg.tar.zst *.pkg.tar.xz; do
            echo "Signing $pkg..."
            gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user "$GPG_KEY_ID" \
              --detach-sign --output "${pkg}.sig" "$pkg"
          done

      - name: Create pacman database
        run: |
          podman run --rm \
            -v "$(pwd)/repo/aarch64:/repo" \
            -w /repo \
            menci/archlinuxarm:base \
            sh -c "
              sed -i '/^#DisableSandbox/s/^#//' /etc/pacman.conf
              echo 'DisableSandbox' >> /etc/pacman.conf
              pacman-key --init
              pacman-key --populate
              pacman -Syu --noconfirm
              pacman -S --noconfirm pacman-contrib
              shopt -s nullglob
              rm -f nabu.db* nabu.files*
              repo-add nabu.db.tar.gz *.pkg.tar.zst *.pkg.tar.xz
            " || true
          if [ ! -f repo/aarch64/nabu.db.tar.gz ]; then
            touch repo/aarch64/nabu.db.tar.gz
          fi

      - name: Fix permissions
        run: sudo chown -R "$USER:$USER" repo/aarch64/

      - name: Sign database files
        run: |
          GPG_KEY_ID="${{ secrets.REPO_GPG_KEY_ID }}"
          cd repo/aarch64
          for db in nabu.db.tar.gz nabu.files.tar.gz; do
            [ -f "$db" ] && gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user "$GPG_KEY_ID" \
              --detach-sign --output "${db}.sig" "$db"
          done

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo/aarch64
          gh release delete repo --yes 2>/dev/null || true
          git push --delete origin repo 2>/dev/null || true

          shopt -s nullglob
          ASSETS=(
            nabu.db
            nabu.db.tar.gz
            nabu.db.tar.gz.sig
            nabu.files
            nabu.files.tar.gz
            nabu.files.tar.gz.sig
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
            *.pkg.tar.xz
            *.pkg.tar.xz.sig
          )
          [ -f nabu-repo.asc ] && ASSETS+=(nabu-repo.asc)
          gh release create repo \
            --title "Pacman Repository" \
            --notes "Automated build of the nabu pacman repository" \
            "${ASSETS[@]}"
